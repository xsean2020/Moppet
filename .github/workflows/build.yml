name: build

# Intel Mac 编译问题排查：仓库依赖 swift-ai-sdk 要求 swift-tools-version 6.0。
# macos-15-intel = 真 Intel runner（用户环境直接复现）；macos-15 + Xcode 16.2 =
# Swift 6.0 最低可用工具链线。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
          - os: macos-15
            xcode: "16.2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: List installed Xcodes
        run: ls /Applications | grep -i xcode || true
      - name: Select Xcode
        if: matrix.xcode != ''
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" \
            || sudo xcode-select -s "/Applications/Xcode${{ matrix.xcode }}.app/Contents/Developer"
      - name: Toolchain version
        run: swift --version
      - name: Build (debug)
        run: swift build
